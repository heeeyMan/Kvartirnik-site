baseURL = "https://kvartirniknn.ru/"
languageCode = "ru-ru"
title = "КАМИН — квартирники и живая музыка в Нижнем Новгороде"
# theme = "ananke"  # removed — using custom layouts

# Отображать будущие страницы (для анонсов квартирников)
buildFuture = true

# ==========================
#   ПАРАМЕТРЫ САЙТА
# ==========================
[params]
  short_title = "КАМИН"
  description = "Камин — творческое пространство в Нижнем Новгороде. Живая музыка, поэзия, театр и искусство в камерной атмосфере квартирника."
  featured_image = "/images/headers/RS-141.webp"
  featured_image_home = "/images/headers/RS-141.webp"
  featured_image_class = "cover bg-center"
  cover_dimming_class = "bg-black-40"
  twitterCard = "summary_large_image"

  # Главное изображение (по умолчанию для соцсетей и SEO)
  images = ["/images/headers/RS-141.webp"]

  # Верификация поисковых систем
  yandex_verification = "65534d22aa1d363e"
  google_verification = "google7c99ec830ba81ff2"

  # Метаданные
  [params.meta]
    author = "КАМИН — творческое пространство"
    keywords = "квартирник Нижний Новгород, живая музыка Нижний Новгород, акустический концерт, камерный концерт, КАМИН, творческий вечер, музыка поэзия театр, акустический вечер, куда сходить в Нижнем Новгороде, концерт в баре, квартирник НН, живое выступление"
    og_type = "website"
    og_site_name = "КАМИН"
    og_locale = "ru_RU"

# ==========================
#   ФРОНТМАТТЕР
# ==========================
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

# ==========================
#   СТАТИСТИКА СБОРКИ
# ==========================
[build]
  writeStats = true

# ==========================
#   МОНТИРОВАНИЯ (mounts)
#   Картинки из static/images дублируем в assets/images, чтобы Hugo мог
#   генерировать превью (Resize). Оригиналы по-прежнему отдаются из static.
#   ВНИМАНИЕ: объявление mounts заменяет дефолтные — поэтому перечисляем все.
# ==========================
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

# ==========================
#   МЕНЮ
# ==========================
[menu]

  [[menu.main]]
    name = "Главная"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Архив"
    url = "/history/"
    weight = 2

  [[menu.main]]
    name = "О нас"
    url = "/about/"
    weight = 3

  [[menu.main]]
    name = "Вопросы"
    url = "/faq/"
    weight = 4
