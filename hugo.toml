baseURL = "https://kvartirniknn.ru/"
languageCode = "ru-ru"
title = "КАМИН"
# theme = "ananke"  # removed — using custom layouts

# Отображать будущие страницы (для анонсов квартирников)
buildFuture = true

# ==========================
#   ПАРАМЕТРЫ САЙТА
# ==========================
[params]
  description = "Камин — творческое пространство в Нижнем Новгороде. Живая музыка, поэзия, театр и искусство в камерной атмосфере квартирника."
  featured_image = "/images/headers/RS-141.webp"
  featured_image_home = "/images/headers/RS-141.webp"
  featured_image_class = "cover bg-center"
  cover_dimming_class = "bg-black-40"
  twitterCard = "summary_large_image"

  # Главное изображение (по умолчанию для соцсетей и SEO)
  images = ["/images/headers/RS-141.webp"]

  # Верификация поисковых систем
  yandex_verification = "65534d22aa1d363e"
  google_verification = "google7c99ec830ba81ff2"

  # Метаданные
  [params.meta]
    author = "КАМИН — творческое пространство"
    keywords = "квартирник Нижний Новгород, музыка, поэзия, театр, искусство, творческий вечер"
    og_type = "website"
    og_site_name = "КАМИН"
    og_locale = "ru_RU"

# ==========================
#   ФРОНТМАТТЕР
# ==========================
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

# ==========================
#   СТАТИСТИКА СБОРКИ
# ==========================
[build]
  writeStats = true

# ==========================
#   МЕНЮ
# ==========================
[menu]

  [[menu.main]]
    name = "Главная"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Архив"
    url = "/history/"
    weight = 2

  [[menu.main]]
    name = "О нас"
    url = "/about/"
    weight = 3
