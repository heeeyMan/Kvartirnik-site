<style>
/* Critical CSS - above the fold */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark;background-color:#160f09}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:transparent;color:#ece1d4;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;letter-spacing:-0.02em;line-height:1.15}
img{max-width:100%;height:auto}
.site-header{position:relative;display:flex;flex-direction:column;overflow:hidden}
.site-header--home{min-height:100vh;min-height:100svh}
.site-header-bg{position:absolute;inset:0;background-size:cover;background-position:center;height:120%;top:-10%}
.site-header-overlay{position:relative;flex:1;display:flex;flex-direction:column;background:rgba(0,0,0,.4)}
.site-header-content{padding:2rem 1.5rem 3rem;max-width:900px;margin:0 auto;text-align:center;width:100%}
.site-header-content--home{margin:auto;padding:2rem 1.5rem}
.site-header-title{color:#fff;font-size:clamp(2rem,5vw,3.5rem);margin:0 0 0.75rem;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.site-nav{padding:1rem 1.5rem}
.site-nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}
.site-nav-logo{color:#fff;text-decoration:none;font-size:1.2rem;font-weight:700;font-family:'Playfair Display',Georgia,serif}
.site-nav-links{display:flex;list-style:none;gap:1.5rem;margin:0;padding:0;align-items:center}
.site-nav-link{color:rgba(255,255,255,.85);text-decoration:none;font-size:.9rem;font-weight:500}
.scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#b5410a,#ff7a18,#f6a623);z-index:10002;pointer-events:none}
</style>
