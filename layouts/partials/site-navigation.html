<nav class="site-nav" role="navigation">
  <div class="site-nav-inner">
    <a href="{{ .Site.Home.RelPermalink }}" class="site-nav-logo">
      {{ with .Site.Params.site_logo }}
        <img src="{{ urls.RelURL . }}" alt="{{ $.Site.Title }}">
      {{ else }}
        {{ .Site.Title }}
      {{ end }}
    </a>
    {{ if .Site.Menus.main }}
    <button class="burger-btn" aria-label="Меню" aria-expanded="false" onclick="this.classList.toggle('burger-open');this.setAttribute('aria-expanded',this.classList.contains('burger-open'));this.closest('.site-nav').querySelector('.site-nav-links').classList.toggle('nav-open')">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
    <ul class="site-nav-links">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}" class="site-nav-link">{{ .Name }}</a>
      </li>
      {{ end }}
      {{ partial "register-menu-item.html" . }}
    </ul>
    {{ end }}
  </div>
</nav>
