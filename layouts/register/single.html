{{ define "main" }}
<div class="register">

  <!-- Соцсети -->
  <div class="register-social scroll-reveal">
    <a href="https://vk.com/guitarniks_nn" target="_blank" rel="noopener noreferrer" class="register-social-btn">
      <img src="/images/utils/vk-icon.svg" alt="" width="22" height="22">
      <span>Группа ВК</span>
    </a>
    <a href="https://t.me/guitarniks_nn" target="_blank" rel="noopener noreferrer" class="register-social-btn">
      <img src="/images/utils/telegram-icon.svg" alt="" width="22" height="22">
      <span>Telegram группа</span>
    </a>
    <a href="https://t.me/mr_deprecated" target="_blank" rel="noopener noreferrer" class="register-social-btn">
      <img src="/images/utils/telegram-icon.svg" alt="" width="22" height="22">
      <span>Написать админу</span>
    </a>
  </div>

  <!-- Форма -->
  <div class="register-form-card scroll-reveal">
    <script src="https://forms.yandex.ru/_static/embed.js"></script>
    <div class="register-form-wrap">
      <iframe
        src="https://forms.yandex.ru/u/697f698a02848f6d6da517af?iframe=1"
        frameborder="0"
        name="ya-form-697f698a02848f6d6da517af"
        width="100%"
        loading="lazy"
        title="Форма регистрации на квартирник">
      </iframe>
    </div>
    <div id="loadingIndicator" class="register-loading">
      <div class="register-spinner">&#9203;</div>
      <p>Загрузка формы регистрации...</p>
    </div>
  </div>

  <p id="formMessage" class="register-message" style="display:none;"></p>

  <!-- Fallback link -->
  <div class="register-fallback scroll-reveal">
    <p>Если форма не загружается, воспользуйтесь прямой ссылкой:</p>
    <a href="https://forms.yandex.ru/u/697f698a02848f6d6da517af"
       target="_blank"
       rel="noopener noreferrer"
       class="register-fallback-btn">
      Открыть форму в новом окне
    </a>
  </div>

</div>

<script>
window.onYandexFormLoad = function() {
  hideLoadingIndicator();
  showMessage('Форма готова к заполнению', 'success');
  adjustIframeHeight();
};

window.onYandexFormError = function() {
  showMessage('Ошибка загрузки формы. Используйте резервную ссылку.', 'error');
  hideLoadingIndicator();
};

function adjustIframeHeight() {
  var iframe = document.querySelector('.register-form-wrap iframe');
  if (!iframe) return;
  iframe.style.height = (window.innerWidth < 768 ? 1000 : 900) + 'px';
}

function showMessage(text, type) {
  var el = document.getElementById('formMessage');
  if (!el) return;
  el.textContent = text;
  el.style.display = 'block';
  el.className = 'register-message register-message--' + type;
  if (type === 'success') {
    setTimeout(function() { el.style.display = 'none'; }, 5000);
  }
}

function hideLoadingIndicator() {
  var el = document.getElementById('loadingIndicator');
  if (el) el.style.display = 'none';
}

window.addEventListener('message', function(event) {
  if (event.origin !== 'https://forms.yandex.ru') return;
  if (event.data && typeof event.data === 'object') {
    switch (event.data.type) {
      case 'formSubmit':
        showMessage('Регистрация прошла успешно! Спасибо за участие!', 'success');
        break;
      case 'formError':
        showMessage('Ошибка при отправке формы. Попробуйте еще раз.', 'error');
        break;
      case 'formHeightChange':
        var iframe = document.querySelector('.register-form-wrap iframe');
        if (iframe && event.data.height) {
          iframe.style.height = Math.max(event.data.height, 800) + 'px';
        }
        break;
    }
  }
});

setTimeout(hideLoadingIndicator, 15000);
window.addEventListener('resize', adjustIframeHeight);

document.addEventListener('DOMContentLoaded', function() {
  var els = document.querySelectorAll('.scroll-reveal');
  if (!els.length) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(function(el) { observer.observe(el); });
});
</script>
{{ end }}
